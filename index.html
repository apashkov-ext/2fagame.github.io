/* layout: a one-screen game — the stage fills the viewport at 16:9; on a portrait screen the stage sits on top and the push panel and touch pad move into a dock below */
:root{
  color-scheme:dark;
  --bg:#070a1f;
  --panel:#10183f;
  --line:#22306e;
  --fg:#d4ecff;
  --muted:#8aa0d0;
  --accent:#7ff6ff;
  --blue:#2f5fd0;
  --ok:#3ccf6e;
  --bad:#e84a5f;
  --warn:#ffd25a;
  --ink:#050817;
  --pixel:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
#app.portrait{justify-content:flex-start}
.px{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
button{font-family:var(--pixel);color:var(--fg);background:var(--panel);border:0;border-bottom:4px solid #080c24;cursor:pointer;line-height:1.4;touch-action:manipulation}
button:hover{filter:brightness(1.15)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:active{border-bottom-width:2px;transform:translateY(2px)}

.stage{position:relative;flex:none;background:var(--ink);overflow:hidden;container-type:size;container-name:stage;width:960px;height:540px;max-width:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

.hud{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:1.8cqw;padding:.9cqh 1.2cqw;background:rgba(5,8,23,.72);font-family:var(--pixel);font-size:clamp(7px,1.05cqw,15px);pointer-events:none;white-space:nowrap}
.m{display:flex;align-items:center;gap:.7cqw}
.lbl{color:var(--muted)}.short{display:none}
.v{color:var(--accent)}.gold{color:var(--warn)}
.bar{position:relative;display:inline-block;width:8cqw;height:1.1cqw;min-height:6px;background:#14205c}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .15s linear}
.bar.warn i{background:var(--warn)}.bar.hot i{background:var(--bad)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--ink) 6px 8px)}
.combo{color:var(--bg);background:var(--accent);padding:.2em .4em .1em;font-size:.9em}
.num{font-variant-numeric:tabular-nums}
.tools{margin-left:auto;display:flex;gap:.6cqw;pointer-events:auto}
.ib{width:clamp(26px,3.4cqw,42px);height:clamp(26px,3.4cqw,42px);padding:0;display:grid;place-items:center;border-bottom-width:3px;color:var(--accent)}
.ib svg{width:58%;height:58%;display:block}
.ib .off{display:none}.ib.muted .on{display:none}.ib.muted .off{display:block}

.push{position:absolute;top:10.5cqh;left:50%;transform:translateX(-50%);width:clamp(230px,46cqw,470px);z-index:4;background:#5aa0ff;padding:3px}
.push-in{background:#14205c;padding:1.2cqh 1.2cqw 1.4cqh;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:1cqw;align-items:start}
.push canvas{width:clamp(24px,3.6cqw,40px);height:auto;aspect-ratio:1;image-rendering:pixelated;flex:none;margin-top:2px}
.pb{flex:1;min-width:0;font-family:var(--pixel);font-size:clamp(8px,1cqw,14px);line-height:1.7}
.ph{display:flex;justify-content:space-between;gap:8px;color:var(--accent)}
.pt i{display:block;height:100%;background:var(--accent);width:100%}
.pt.low i{background:var(--bad)}
.pbtn{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;margin-top:1.2cqh;font-size:clamp(10px,1.3cqw,17px)}
.pbtn button{width:100%;font-size:1em;padding:.5em 1em .35em;min-height:clamp(34px,6cqh,58px)}
.push.empty .pbtn{display:none}
#bYes{background:var(--ok);border-bottom-color:#1c6e4a;color:#071a1a}
#bNo{background:var(--bad);border-bottom-color:#9a2238;color:#200810}
.pb-empty{display:none;color:var(--muted)}
.push.empty .pb-live{display:none}
.push.empty .pb-empty{display:block}
.push.empty{display:none}

.toasts{position:absolute;left:1.6cqw;top:12cqh;width:24cqw;display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none}
.t-ok{background:var(--ok);color:#071a1a}.t-bad{background:var(--bad);color:#200810}.t-warn{background:var(--warn);color:#2a1420}

.banner{position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);text-align:center;z-index:2;pointer-events:none;font-family:var(--pixel);width:max-content;max-width:90%;padding:.7em 1.3em .6em;background:rgba(5,8,23,.66)}
.banner .bt{font-size:clamp(11px,2.2cqw,24px);color:var(--accent);text-shadow:0 2px 0 var(--ink)}
.banner .bs{font-size:clamp(8px,1.2cqw,13px);color:var(--fg);margin-top:.8em;text-shadow:0 2px 0 var(--ink)}
.banner.bad .bt{color:var(--bad)}

.pad{display:none;position:absolute;left:2cqw;right:2cqw;bottom:3cqh;z-index:4;justify-content:space-between;align-items:flex-end;pointer-events:none}
#app.touch .pad{display:flex}
.pad .grp{display:flex;gap:1.6cqw;pointer-events:auto}
.pad button{width:clamp(48px,15cqh,84px);height:clamp(48px,15cqh,84px);padding:0;display:grid;place-items:center;background:rgba(16,24,63,.38);border:2px solid rgba(90,160,255,.55);border-bottom-width:5px;color:var(--fg);touch-action:none}
.pad button svg{width:48%;height:48%}
.pad button.act{background:rgba(47,95,208,.7);color:#fff}
.pad button.pressed{transform:translateY(2px);border-bottom-width:3px;filter:brightness(1.3)}

.dock{display:none;width:100%;flex:1;min-height:0;flex-direction:column;gap:10px;padding:12px 12px 16px}
#app.portrait .dock{display:flex}
#app.portrait .push{position:static;transform:none;width:100%}
#app.portrait .push.empty{display:block}
#app.portrait .pb{font-size:11px}
#app.portrait .push canvas{width:40px}
#app.portrait .pbtn{font-size:15px;gap:10px;margin-top:12px}
#app.portrait .pbtn button{min-height:56px}
#app.portrait .toasts{position:static;width:100%;min-height:34px}
#app.portrait .toast{font-size:10px}
#app.portrait .pad{position:static;margin-top:auto;padding:0}
#app.portrait .pad .grp{gap:8px}
#app.portrait .pad button{width:min(calc((100vw - 64px) / 6),84px);height:min(calc((100vw - 64px) / 6),84px)}

.scr{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,8,23,.88);padding:20px 16px;overflow:auto}
.card{max-width:620px;width:100%;margin:auto;text-align:center;display:flex;flex-direction:column;gap:clamp(10px,2.2vh,18px);align-items:center}
.card h2{font-family:var(--pixel);font-weight:400;font-size:clamp(18px,4vw,34px);margin:0;color:var(--accent);line-height:1.35;text-wrap:balance}
.card h2.bad{color:var(--bad)}
.rank{font-family:var(--pixel);font-size:clamp(10px,1.4vw,13px);color:var(--warn)}
.big{font-family:var(--pixel);font-size:clamp(22px,4.4vw,36px);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;font-size:clamp(13px,1.6vw,15px);text-align:left;width:100%;max-width:440px}
.stats span{color:var(--muted)}.stats b{font-weight:500;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-block:3px}
.cta{background:var(--blue);border-bottom-color:#14205c;font-size:clamp(11px,1.4vw,14px);padding:1.1em 1.6em .9em;min-height:48px}
.hint{font-family:var(--pixel);font-size:clamp(8px,1vw,10px);color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar i{transition:none}}

/* hero select — squad-page look: one featured hero card + roster, sticky start */
#app{--hero:#6ea8ff}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cta.alt{background:var(--panel);border-bottom-color:#060a1e}
.scr.selscr{align-items:flex-start;padding:16px}
.sel2{--c:var(--hero);width:100%;max-width:1040px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "fc" "roster" "go";gap:12px;text-align:left}
.sh{grid-area:head;display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.eyebrow{font-family:var(--pixel);font-size:9px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.sh h1{font-family:var(--pixel);font-weight:400;font-size:clamp(15px,2.3vw,26px);line-height:1.3;margin:0}
.sh h1 span{color:var(--accent)}
.shr{display:flex;align-items:center;gap:12px;font-family:var(--pixel);font-size:9px;color:var(--muted)}
.shr b{font-weight:400;color:var(--warn)}
.lnk{font-family:var(--pixel);font-size:9px;color:var(--accent);background:transparent;border:1px solid var(--line);border-bottom-width:1px;padding:9px 12px 8px;min-height:40px;min-width:40px}
.lq{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.startb:focus-visible,.lnk:focus-visible,.hc:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #ffffff}
.lnk:active{transform:none}
/* swipe works on the whole card; the strip keeps taps */
.fc{touch-action:pan-y}
.fc{grid-area:fc;position:relative;display:grid;grid-template-columns:minmax(170px,280px) minmax(0,1fr);background:#0d1436;border:2px solid var(--line);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.fc::before,.fc::after,.hc[aria-checked="true"]::before,.hc[aria-checked="true"]::after{content:"";position:absolute;width:14px;height:14px;border:3px solid var(--c);pointer-events:none;z-index:1}
.fc::before,.hc[aria-checked="true"]::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.fc::after,.hc[aria-checked="true"]::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.fv{display:flex;flex-direction:column;border-right:2px solid var(--line);background:#0a1030;min-width:0}
.fi{display:flex;flex-direction:column;min-width:0}
.pfw{grid-area:pf;position:relative;touch-action:pan-y;background:#060a1e}
.pfw .pf{display:block;width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:52px;padding:0;display:grid;place-items:center;background:rgba(5,8,23,.82);background:color-mix(in srgb,var(--c) 18%,rgba(5,8,23,.85));border:1px solid var(--c);color:var(--c)}
.nav:hover{background:color-mix(in srgb,var(--c) 32%,rgba(5,8,23,.85))}
.nav:active{transform:translateY(-50%)}
.nav svg{width:18px;height:18px}
.nav.prev{border-left:0}.nav.next{border-right:0}
.nav.prev{left:0}.nav.next{right:0}
.stw{grid-area:st;position:relative;border-top:2px solid var(--line);background:#0a1030}
.tapme{position:absolute;top:6px;left:6px;font-family:var(--pixel);font-size:8px;color:#050817;background:var(--c);padding:3px 5px 2px;pointer-events:none;animation:tapb 1s steps(2) infinite}
@keyframes tapb{50%{opacity:.35}}
.strip{display:block;width:100%;height:auto;aspect-ratio:120/56;image-rendering:pixelated;image-rendering:crisp-edges;background:#0a1030;cursor:pointer;touch-action:manipulation}
.top{grid-area:top;padding:14px 16px 0;display:flex;flex-direction:column;gap:9px;min-width:0;touch-action:pan-y}
.tag{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--pixel);font-size:9px;color:var(--muted);letter-spacing:.06em}
.tag b{font-weight:400;color:var(--c);text-align:right}
.top h2{font-family:var(--pixel);font-weight:400;font-size:clamp(14px,1.7vw,19px);line-height:1.35;margin:0;color:var(--fg)}
.quote{margin:0;font-size:14px;color:var(--muted);font-style:italic}
.stats2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);max-width:360px}
.seg{display:flex;gap:3px}.seg i{display:block;width:100%;max-width:26px;height:9px;background:#1a2454}.seg i.on{background:var(--c)}
.kv{grid-area:kv;padding:12px 16px 16px;display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.45;min-width:0}
.kv span{display:block;font-family:var(--pixel);font-size:8px;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.kv p{margin:0}.kv strong{font-weight:600;color:var(--c)}
.kv .k{font-family:var(--pixel);font-size:8px;color:#050817;background:var(--c);padding:2px 4px 1px;margin-left:6px;letter-spacing:0}
.roster{grid-area:roster;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.hc{--c:var(--accent);position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px 8px;min-height:64px;text-align:center;min-width:0;background:#0d1436;border:2px solid var(--line);font-family:var(--pixel);font-size:8px;color:var(--muted);line-height:1.6}
.hc:active{transform:none}
.hc canvas{width:56px;height:56px;flex:none;image-rendering:pixelated;background:#050817}
.hc>div{min-width:0;max-width:100%}.hc span:not(.n){display:block;font-size:7px;color:#5a6aa8}
.hc b{display:block;font-weight:400;color:var(--fg);font-size:10px;line-height:1.5;overflow-wrap:anywhere}
.hc .n{position:absolute;top:3px;left:5px;color:#3a4a8a}
.hc[aria-checked="true"]{border-color:var(--c);background:#13205a;color:var(--c)}
.hc[aria-checked="true"] b{color:var(--c)}
.go{grid-area:go;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.startb{display:flex;align-items:center;justify-content:center;min-width:300px;min-height:58px;padding:.95em 1.6em .8em;font-size:clamp(12px,1.4vw,15px);line-height:1.5;text-align:center;background:var(--c);color:#050817;border-bottom-color:rgba(0,0,0,.45)}
.fc.swap .top{animation:swp .2s steps(4)}
@keyframes swp{from{opacity:.2;transform:translateX(calc(var(--sd,1) * 10px))}to{opacity:1;transform:none}}
.fc{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 0 26px -6px var(--c)}
.fcg{position:absolute;inset:-2px;z-index:-1;pointer-events:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent),0 0 38px -4px var(--c);opacity:0;animation:fcglow 2.4s ease-in-out infinite}
@keyframes fcglow{50%{opacity:1}}
.fc.swap .pf{animation:slam .32s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{opacity:0;transform:translateX(calc(var(--sd,1) * 40%)) scale(1.15);filter:brightness(3)}55%{opacity:1;filter:brightness(1.6)}100%{transform:none;filter:none}}
.fc.swap .top h2{animation:stamp .34s steps(6)}
@keyframes stamp{0%{transform:scale(2.2);opacity:0;text-shadow:0 0 12px var(--c)}50%{transform:scale(.92);opacity:1}75%{transform:scale(1.06) translateX(2px)}100%{transform:none}}
.pfw::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay}
.fc.swap .pfw::after{animation:flashw .3s steps(3)}
@keyframes flashw{0%{opacity:.9}100%{opacity:0}}
.hc[aria-checked="true"]{box-shadow:0 0 18px -4px var(--c),inset 0 0 12px -6px var(--c)}
.hc[aria-checked="true"] canvas{animation:breathe 1.1s steps(2) infinite}
@keyframes breathe{50%{transform:translateY(-2px)}}
.hc:hover:not([aria-checked="true"]){border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 0 14px -6px var(--c)}
.startb{box-shadow:0 0 24px -6px var(--c)}
.sh h1{animation:glitch 5s steps(1) infinite}
.sh h1 span{text-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
@keyframes glitch{0%,92%,100%{text-shadow:none;transform:none}93%{text-shadow:-2px 0 #ff2a6d,2px 0 #05d9e8;transform:translateX(1px)}95%{text-shadow:2px 0 #ff2a6d,-2px 0 #05d9e8;transform:translateX(-2px) skewX(-6deg)}97%{text-shadow:-1px 0 #ff2a6d,1px 0 #05d9e8;transform:none}}
/* phone, portrait */
@media (max-width:640px) and (orientation:portrait){
  .scr.selscr{padding:10px 12px 0}
  .sel2{gap:10px;grid-template-areas:"head" "roster" "fc" "go"}
  .eyebrow{display:none}.sh h1{font-size:14px}
  .fc{grid-template-columns:44% minmax(0,1fr);grid-template-areas:"pf top" "st st" "kv kv"}
  .fv,.fi{display:contents}.pfw{border-right:2px solid var(--line)}
  .strip{width:auto;max-width:100%;height:112px;margin:0 auto}
  .top{padding:10px 10px 8px;gap:7px}.top h2{font-size:13px}.tag{flex-direction:column;gap:3px;font-size:8px}.tag b{text-align:left}
  .quote{display:none}.stats2{font-size:12px;gap:5px 8px}.seg i{height:8px}
  .kv{padding:10px 12px 12px;font-size:13px;gap:7px}
  .roster{gap:6px}
  .hc{flex-direction:column;align-items:stretch;gap:4px;padding:4px 4px 6px;min-height:0;text-align:center}
  .hc canvas{width:100%;height:auto;aspect-ratio:1}
  .roster{gap:4px}.hc{padding:3px 3px 3px}.hc>div,.hc .n{display:none}
  .go{position:sticky;bottom:0;z-index:2;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(7,10,31,0),var(--bg) 22%)}
  .startb{width:100%;min-width:0}
}
/* short screens: laptops at 540–660 px */
@media (max-height:660px) and (min-width:641px){
  .scr.selscr{padding-block:8px}.sel2{gap:8px}.eyebrow{display:none}.sh h1{font-size:17px}
  .fc{grid-template-columns:minmax(150px,200px) minmax(0,1fr)}
  .quote{font-size:13px}.kv{font-size:13px;gap:7px;padding-top:8px}.top{gap:7px;padding-top:11px}
  .hc{min-height:0;padding:4px 3px 5px;gap:3px}.hc canvas{width:40px;height:40px}.hc span:not(.n){display:none}.startb{min-height:50px}
}
/* phones in landscape: roster on the left, card in the middle, start on the right */
@media (max-height:520px) and (orientation:landscape){
  .scr.selscr{padding:8px 10px}
  .sel2{max-width:none;grid-template-columns:minmax(130px,180px) minmax(0,1fr);grid-template-areas:"roster fc" "head fc" "go fc";grid-template-rows:1fr auto auto;gap:8px;height:100%}
  .sh>div:first-child{display:none}.shr{width:100%;justify-content:space-between;gap:8px;font-size:8px}.lt{display:none}.lq{display:inline}
  .roster{grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:6px}
  .hc{min-height:0;padding:3px}.hc canvas{width:100%;height:auto;aspect-ratio:1;max-width:64px}.hc>div,.hc .n{display:none}
  .go{flex-direction:column;align-items:stretch}.startb{min-width:0;width:100%;min-height:46px;padding:.7em .6em .6em;font-size:11px}
  .fc{grid-template-columns:min(46vh,190px) minmax(0,1fr);align-self:stretch}
  .quote{display:none}.top{padding:8px 10px 0;gap:5px}.top h2{font-size:12px}.tag{font-size:7px}
  .stats2{font-size:11px;gap:3px 8px}.seg i{height:7px}
  .kv{padding:6px 10px 8px;font-size:12px;gap:5px;line-height:1.35}
}
@media (max-height:340px) and (orientation:landscape){.fc{grid-template-columns:min(40vh,130px) minmax(0,1fr)}.kv .atkrow{display:none}.hc canvas{max-width:44px}.roster{gap:4px}.sel2{gap:6px}}
@media (prefers-reduced-motion:reduce){.fc.swap .pf,.fc.swap .top,.fc.swap .top h2,.fc.swap .pfw::after,.tapme,.fc,.fcg,.sh h1,.hc[aria-checked="true"] canvas{animation:none}}
/* in-game menu */
.menu{max-width:440px;gap:12px}
.mh{--c:var(--hero);display:flex;gap:12px;align-items:center;text-align:left;background:#0b1233;padding:8px 12px 8px 8px;border-left:3px solid var(--c);width:100%}
.mh canvas{width:56px;height:56px;image-rendering:pixelated;background:#050817;flex:none}
.mh b{display:block;font-family:var(--pixel);font-weight:400;font-size:10px;color:var(--c);line-height:1.6}
.mh span{font-size:13px;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:8px;width:100%}
.mi{width:100%;font-size:clamp(11px,1.4vw,13px);padding:1em 1.2em .85em;min-height:46px}
.mi.pri{background:var(--blue);border-bottom-color:#14205c}
.mi.warn{background:#2bff88;color:#03200f;border-bottom-color:#12a052}
.help{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;text-align:left;width:100%;font-size:14px;line-height:1.4;align-items:baseline}
.help kbd{font-family:var(--pixel);font-size:9px;color:var(--accent);white-space:nowrap}
.help .rule{grid-column:1/-1;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
@media (max-height:420px){.menu{gap:8px}.menu .mh{display:none}.help{gap:4px 12px}}
/* HUD: ability charge */
.bar.ch i{background:var(--hero)}
.bar.ch.full i{animation:chb .5s steps(2) infinite}
@keyframes chb{50%{background:#ffffff}}
.kq{font-family:var(--pixel);color:var(--bg);background:var(--hero);padding:.15em .35em .05em;font-size:.85em}
.pad button.abil{color:var(--hero);border-color:var(--hero)}
.pad button.abil.full{background:var(--hero);color:#050817}
@media (prefers-reduced-motion:reduce){.bar.ch.full i{animation:none}}

/* ================= type system v2 =================
   words → Russo One · digits → Press Start 2P · lines of text → Golos Text; nothing smaller than ~11 px on a phone */
:root{--title:"Russo One","Arial Black",system-ui,sans-serif;--soft:#a8b4d8}
button{font-family:var(--title);letter-spacing:.04em}
/* HUD */
.hud{font-family:var(--title);font-size:clamp(10px,1.3cqw,17px);gap:1.7cqw;padding:.8cqh 1.2cqw}
.lbl{color:var(--soft);letter-spacing:.05em}
.hud .num,.combo,.kq{font-family:var(--pixel);font-size:.82em}
.bar{height:1.15cqw;min-height:7px}
.combo{padding:.3em .45em .2em}
#hScore{display:inline-block}
#hScore.bump{animation:bump .22s steps(3)}
#hCombo.bump{animation:bump .28s steps(3)}
@keyframes bump{0%{transform:scale(1.45)}100%{transform:none}}
/* push */
.push{width:clamp(250px,44cqw,500px)}
.push-in{display:block;padding:1.1cqh 1.3cqw 1.4cqh;background:#0d1436}
.pb{font-family:var(--body);font-size:inherit;line-height:1.3}
.ph{display:flex;align-items:center;gap:.9cqw;color:var(--accent)}
.ph canvas{width:clamp(18px,2.4cqw,30px);margin:0}
.ptl{font-family:var(--title);font-size:clamp(12px,1.6cqw,20px);letter-spacing:.06em;color:var(--accent)}
.ph span.pq{font-family:var(--title);font-size:clamp(10px,1.2cqw,15px);color:#050817;background:var(--soft);padding:.15em .45em .05em;font-size:clamp(10px,1.2cqw,15px)}
.ph span.pq:empty{display:none}
.pt{flex:1;height:clamp(5px,.75cqw,9px);margin:0;background:#1a2454}
.pt i{transform-origin:0 50%;transition:transform .12s linear}
.pt.low i{animation:tlow .4s steps(2) infinite}
@keyframes tlow{50%{background:#ffffff}}
.pmain{display:flex;align-items:center;justify-content:space-between;gap:1.2cqw;margin-top:1cqh}
.pwho{min-width:0}
.pl1{font-weight:700;font-size:clamp(13px,1.8cqw,22px);line-height:1.2;color:#eef2ff;overflow-wrap:anywhere}
.pl1 .arr{color:var(--soft);font-weight:500}
.pl2{font-weight:500;font-size:clamp(11px,1.35cqw,16px);color:var(--soft);margin-top:.25em;overflow-wrap:anywhere}
.pc{flex:none;display:flex;flex-direction:column;align-items:center;gap:.4em;padding:.15em 0 .15em 1.1em;background:none;border-left:2px solid #22306e}
.pc span{font-family:var(--title);font-size:clamp(9px,1.05cqw,14px);color:var(--soft);letter-spacing:.06em}
.pc b{font-family:var(--pixel);font-weight:400;font-size:clamp(17px,2.7cqw,34px);line-height:1;color:var(--warn)}
.pbtn{margin-top:1.3cqh;gap:1.1cqw;font-size:clamp(14px,1.9cqw,24px)}
.pbtn button{padding:.4em 1em .25em;min-height:clamp(34px,6cqh,56px);letter-spacing:.08em}
.pb-empty{font-size:15px}
/* a new push drops in; the code flips in; a decision flashes the frame */
.push.pin{animation:pushin .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes pushin{0%{translate:0 -30%;scale:.92;opacity:0}60%{opacity:1}100%{translate:0 0;scale:1}}
.push.pin .pc b{animation:codein .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes codein{0%{opacity:0;transform:scale(1.5)}35%{opacity:1}100%{transform:none}}
.push.fok .push-in{animation:fok .34s steps(3)}.push.fbad .push-in{animation:fbad .38s steps(4)}
@keyframes fok{0%,60%{background:#1f7a46}}
@keyframes fbad{0%,70%{background:#7a1a2a}25%{translate:-6px 0}50%{translate:5px 0}75%{translate:-3px 0}}
.push.pout{animation:pout .24s steps(3) forwards;pointer-events:none}
@keyframes pout{to{scale:.94;opacity:0;translate:0 -12%}}
/* toasts: what happened in words, the details in plain text */
.toast{font-family:var(--title);font-size:clamp(11px,1.3cqw,16px);letter-spacing:.03em;line-height:1.2;padding:.6em .8em .5em;animation:tin .3s cubic-bezier(.2,1.5,.4,1)}
.toast small{display:block;margin-top:.25em;font-family:var(--body);font-weight:600;font-size:.86em;letter-spacing:0;line-height:1.25}
.toast.out{animation:tout .25s steps(3) forwards!important}
@keyframes tin{0%{transform:translateX(-115%)}100%{transform:none}}
@keyframes tout{to{transform:translateX(-30%);opacity:0}}
.toasts{width:25cqw}
/* banner: time · event · line of text */
.banner{font-family:var(--title);padding:.5em 1.4em .65em;background:rgba(5,8,23,.84)}
.banner .bk{font-family:var(--pixel);font-size:clamp(10px,1.05cqw,13px);color:var(--accent);margin-bottom:.45em}
.banner .bk:empty{display:none}
.banner .bt{font-size:clamp(17px,3.3cqw,40px);line-height:1.1;letter-spacing:.03em;text-shadow:.08em .08em 0 var(--ink)}
.banner .bs{font-family:var(--body);font-weight:600;font-size:clamp(11px,1.5cqw,18px);margin-top:.4em;text-shadow:0 2px 0 var(--ink)}
.banner.bad .bk{color:#ff9aa4}
.banner.show{animation:bnin .38s cubic-bezier(.2,1.6,.4,1)}
.banner.show .bt{animation:bnt .45s steps(5)}
.banner.show .bs{animation:bns .5s ease-out}
.banner.bad.show{animation:bnin .38s cubic-bezier(.2,1.6,.4,1),bnshake .3s steps(3) .38s}
@keyframes bnin{0%{scale:1.5;opacity:0}100%{scale:1;opacity:1}}
@keyframes bnt{0%{letter-spacing:.5em;opacity:0}100%{letter-spacing:.03em}}
@keyframes bns{0%,40%{opacity:0;translate:0 6px}100%{opacity:1;translate:0 0}}
@keyframes bnshake{33%{translate:-6px 0}66%{translate:5px 0}}
/* VS intro: crisp text over the pixel panels */
.intro{position:absolute;inset:0;z-index:2;pointer-events:none;font-family:var(--title)}
.intro>*{position:absolute}
.ic{left:50%;top:max(11.5%,34px);transform:translateX(-50%);font-size:2.4cqw;color:var(--accent);letter-spacing:.06em;white-space:nowrap;text-shadow:.12em .12em 0 var(--ink)}
.ic b{font-family:var(--pixel);font-weight:400;font-size:.8em;margin-right:.4em}
.ih,.ie{top:70.5%;display:flex;flex-direction:column;gap:.35cqw;white-space:nowrap}
.ih span,.ie span{font-size:1.75cqw;letter-spacing:.06em}
.ih b,.ie b{font-weight:400;font-size:3.6cqw;line-height:1;color:#ffffff;letter-spacing:.02em;text-shadow:.08em .08em 0 var(--ink)}
.ie span{color:#ff5a7a}
.ivs{left:50%;top:49%;transform:translate(-50%,-50%);font-size:7.5cqw;color:var(--warn);text-shadow:.07em .07em 0 #6a2e04,0 0 .3em rgba(255,210,90,.35)}
.ivs.slam{animation:vsslam .36s cubic-bezier(.2,1.6,.4,1)}
@keyframes vsslam{0%{transform:translate(-50%,-50%) scale(2.6);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%)}}
.icd{left:50%;top:50.4%;transform:translate(-50%,-50%);font-family:var(--pixel);font-size:10cqw;line-height:1;color:#ffffff;text-shadow:.07em .07em 0 var(--ink);white-space:nowrap}
.icd.go{font-family:var(--title);font-size:7.5cqw;color:var(--hero);text-shadow:.07em .07em 0 var(--ink),0 0 .35em color-mix(in srgb,var(--hero) 45%,transparent)}
.icd.pop{animation:cdpop .32s cubic-bezier(.2,1.5,.4,1)}
.icd.go.pop{animation:gopop .45s cubic-bezier(.2,1.7,.4,1)}
@keyframes cdpop{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}45%{opacity:1}100%{transform:translate(-50%,-50%)}}
@keyframes gopop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}100%{transform:translate(-50%,-50%)}}
.isk{left:50%;bottom:3.5%;transform:translateX(-50%);font-size:1.6cqw;color:#8a96c8;letter-spacing:.06em;white-space:nowrap}
/* screens */
.card h2{font-family:var(--title);font-size:clamp(26px,4.8vw,46px);letter-spacing:.02em;line-height:1.15;text-shadow:.08em .08em 0 var(--ink)}
.scr>.card{animation:cardin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{0%{scale:.9;opacity:0}100%{scale:1;opacity:1}}
.scr{animation:scrin .2s ease-out}
@keyframes scrin{from{background:rgba(5,8,23,0)}}
.hint{font-family:var(--title);font-size:clamp(13px,1.6vw,16px);letter-spacing:.05em}
.rank{font-family:var(--title);font-size:clamp(17px,2.3vw,24px);letter-spacing:.04em;text-shadow:.08em .08em 0 var(--ink)}

<script>

function mk(w,h,pr,dec,sc,mm){
  sc=sc||1;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');

        let v=gx*u*LV[0]+gy*u*LV[1]+Math.sqrt(1-u*u)*LV[2];v+=(BY[y&3][x&3]/16-.47)*.09;iv[i]=v;ix[i]=v<.08?1:v<.35?2:v<.62?3:v<.86?4:5}
      break}}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,k=pi[i];if(k<0)continue;const p=pr[k];let edge=false,contact=false;

function pushChime(){const n=AC.currentTime,out=AC.createGain();out.gain.value=1.2;out.connect(AC.destination);
  const bell=(f,t0,dur,vol)=>{for(const[mul,type,v]of[[1,'sine',1],[2,'triangle',.35],[3.01,'sine',.12]]){const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.type=type;o.frequency.setValueAtTime(f*mul,n+t0);
      g.gain.setValueAtTime(.0001,n+t0);g.gain.exponentialRampToValueAtTime(vol*v,n+t0+.008);g.gain.exponentialRampToValueAtTime(.0001,n+t0+dur*(mul>1?.6:1));o.connect(g);g.connect(out);o.start(n+t0);o.stop(n+t0+dur+.03)}};
  bell(1318.5,0,.32,.07);bell(1975.5,.1,.5,.075);
  const bz=AC.createOscillator(),lp=AC.createBiquadFilter(),bg=AC.createGain();bg.gain.value=0;bz.type='sawtooth';bz.frequency.value=110;lp.type='lowpass';lp.frequency.value=420;
  bg.gain.setValueAtTime(.0001,n);for(const t0 of[0,.11]){bg.gain.setValueAtTime(.0001,n+t0);bg.gain.linearRampToValueAtTime(.035,n+t0+.01);bg.gain.setValueAtTime(.035,n+t0+.06);bg.gain.linearRampToValueAtTime(.0001,n+t0+.075)}
  bz.connect(lp);lp.connect(bg);bg.connect(out);bz.start(n);bz.stop(n+.2)}

  let p;if(bomb&&bombWho)p=bombWho;else{do p=pick(PEOPLE);while(p===lastWho||(p===bombWho&&!fake))}lastWho=p;
  let code=rackCode;
  if(fake){do code=10+rnd(90);while(code===rackCode)}
  let time=clockStr(),city=pick(CITIES);
  if(fake){if(Math.random()<.45)time=pad(1+rnd(5))+':'+pad(rnd(60));if(Math.random()<.35)city=pick(['город скрыт','неизвестно','???'])}
  if(bomb)time=clockStr();
  const pt=pushTime();queue.push({id:++pid,legit:!fake,name:p[0],dept:p[1],g:p[2],res:bomb&&bombWho?bombRes:pick(RES),city,time,code,t:pt,max:pt});
  if(queue.length===1)renderPush();else updateQueueLabel();
}

try{const v=parseInt(localStorage.getItem('vtoroy-faktor-hero'),10);if(v>=0&&v<HEROES.length)heroIx=v}catch(e){}
let HR=HEROES[heroIx];
function setHero(i){heroIx=(i+HEROES.length)%HEROES.length;HR=HEROES[heroIx];document.getElementById('app').style.setProperty('--hero',HR.col);
  try{localStorage.setItem('vtoroy-faktor-hero',String(heroIx))}catch(e){}}
const heroSpeed=()=>79+13*HR.st[0];                 // 2→105 … 5→144 px/s
const heroDmg=()=>.6+.2*HR.st[1];                   // 2→1.0 … 5→1.6 per hit
const pushTime=()=>6.5+.5*HR.st[2]+(heroIx===1?3:0);// 2→7.5 … 5→9 s, Связист +3 s
const nearRack=()=>Math.abs(P.x-RX)<46&&P.y>=GROUND-1;
const armorK=()=>nearRack()?1-.06*HR.st[3]:1;       // 2→−12 %, 4→−24 % rack damage while next to it
const CHG={pk:1,lt:3,br:4,in:6,wm:5};
let charge=0,abDeny=0,domeT=0,beam=null,SHOTS=[],RINGS=[];
function addCharge(n){if(state!=='play')return;if(heroIx===5)n*=1.25; // Мастер: Velocity команды
  const was=charge>=100;charge=Math.min(100,charge+n);
  if(!was&&charge>=100){toast('ok','ГОТОВО: '+HR.ab+' — '+(TOUCH?'кнопка ★':'клавиша Q'));sfx('ready')}}
function doAbility(){if(state!=='play')return;
  if(charge<100){if(abDeny<=0){sfx('deny');abDeny=.3}return}
  charge=0;const cx=P.x,cy=P.y-22;

    const pc=s.querySelector('.mh canvas').getContext('2d');pc.imageSmoothingEnabled=false;if(PORTRAIT[heroIx])pc.drawImage(PORTRAIT[heroIx],0,0);

  else if(kind==='help'){const rows=TOUCH?HELP_TOUCH:HELP_KEYS;
    s.innerHTML='<div class="card menu"><h2>УПРАВЛЕНИЕ</h2><div class="help">'+rows.map(r=>'<kbd>'+r[0]+'</kbd><span>'+r[1]+'</span>').join('')+
      '<div class="rule">Код в пуше совпал с кодом на стойке — подтверждай, не совпал — отклоняй.</div></div>'+
      '<button class="mi pri px" id="btnBack" type="button">НАЗАД</button></div>';
    $('btnBack').addEventListener('click',()=>showScreen(state==='title'?'title':'pause'))}
  else{const acc=stats.dec?Math.round(100*stats.ok/stats.dec):0;
    s.innerHTML='<div class="card"><h2 class="'+(win?'':'bad')+'">'+(win?'СМЕНА ЗАКРЫТА':'СЕРВЕР ЛЁГ')+'</h2><div class="hint">'+HR.code+' · '+HR.name.toUpperCase()+'</div><div class="rank">'+rankOf(score)+'</div><div class="big num" id="overScore">'+(REDUCE?score:0)+'</div>'+
    '<div class="stats"><div><span>Отбито атакующих</span><b>'+stats.kills+'</b></div><div><span>Верных решений</span><b>'+stats.ok+' из '+stats.dec+'</b></div>'+
    '<div><span>Точность по пушам</span><b>'+acc+'%</b></div><div><span>Ложных отказов</span><b>'+stats.falseNo+'</b></div>'+
    '<div><span>Взломов через пуш</span><b>'+stats.breach+'</b></div><div><span>Истёкших пушей</span><b>'+stats.expired+'</b></div>'+
    '<div><span>Аптайм в конце</span><b>'+uptime.toFixed(1)+'%</b></div><div><span>Рекорд</span><b>'+best+'</b></div></div>'+
    '<div class="btns"><button class="cta px" id="btnMain" type="button">ЕЩЁ ОДНА СМЕНА</button><button class="cta alt px" id="btnHero" type="button">СМЕНИТЬ ГЕРОЯ</button></div></div>';
    $('btnHero').addEventListener('click',toHeroSelect);
    if(!REDUCE){const sc=score,t0=performance.now(),D=900,ev=$('overScore');const step=now=>{if(!ev.isConnected)return;const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);ev.textContent=String(Math.round(sc*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}}
  const bm=$('btnMain');if(bm)bm.addEventListener('click',mainAction);
  if(kind!=='title'&&!TOUCH){const f=s.querySelector('#btnMain,.mi');if(f)f.focus({preventScroll:true})}
}

// select screen state: live portrait + sprite strip of the featured hero
const SEL={src:[],pf:null,strip:null,cache:new Map(),lastPf:0,swipeAt:0,bgDone:false,tried:false};
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SQH=[{id:3,accent:'#6ea8ff',eyes:[[49,33,7,3],[58,33,7,3]]},{id:0,accent:'#7ff6ff',eyes:[[44,31,7,3],[58,32,8,3]]},{id:1,accent:'#7ad870',eyes:[[31,30,7,3],[51,29,7,3]]},{id:2,accent:'#ffb84a',eyes:[[32,32,6,3],[46,31,9,4]]},
  {id:5,accent:'#fff05a',eyes:[[37,28,7,2],[51,28,7,2]]},{id:6,accent:'#ff7aa2',eyes:[[40,32,7,2],[56,33,7,2]]}];
function stripSprites(i){if(i===0){const G=SPR.g;return{idle:G.idle,walk:G.walk,atk:G.swing,wind:G.wind}}return SPR.h[i]}
function pickHero(i,dir){if(state!=='title'||scrKind!=='title')return;const n=(i+HEROES.length)%HEROES.length;if(n===heroIx)return;setHero(n);renderHeroInfo(dir||1);selSound(n)}
function renderHeroInfo(dir){const fc=$('fc');if(!fc)return;const h=HR;
  fc.style.setProperty('--c',h.col);fc.parentNode.style.setProperty('--c',h.col);
  document.querySelectorAll('.hc').forEach(b=>{const on=+b.dataset.i===heroIx;b.setAttribute('aria-checked',String(on));b.tabIndex=on?0:-1});
  const foc=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('hc');
  if(foc){const b=document.querySelector('.hc[data-i="'+heroIx+'"]');if(b)b.focus({preventScroll:true})}
  $('selPf').setAttribute('aria-label','Портрет: '+h.name);
  $('selTop').innerHTML='<div class="tag"><span>'+h.code+'</span><b>'+h.role.toUpperCase()+'</b></div><h2>'+h.name.toUpperCase()+'</h2>'+(h.bio?'<p class="bio"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 1h1v2H5zM8 0h1v3H8zM2 5h10v2h2v4h-2v2H3v-1H2zM12 8v2h1V8zM1 14h12v1H1z"/></svg>'+h.bio+'</p>':'')+'<p class="quote">'+h.quote+'</p>'+
    '<div class="stats2">'+STAT_NAMES.map((n,k)=>'<span>'+n+'</span><span class="seg" role="img" aria-label="'+n+': '+h.st[k]+' из 5">'+[1,2,3,4,5].map(v=>'<i class="'+(v<=h.st[k]?'on':'')+'"></i>').join('')+'</span>').join('')+'</div>';
  $('selKv').innerHTML='<div class="atkrow"><span>АТАКА</span><p>'+h.atk+'</p></div>'+
    '<div><span>СПОСОБНОСТЬ<b class="k">'+(TOUCH?'★':'Q')+'</b></span><p><strong>'+h.ab+'.</strong> '+h.abd+'</p></div>'+
    '<div><span>ПАССИВНО</span><p><strong>'+h.pas+'.</strong> '+h.pasd+'</p></div>';
  $('selFor').textContent='НАЧАТЬ ЗА '+h.acc.toUpperCase();
  $('selLive').textContent='Выбран '+h.name+', '+h.role.toLowerCase();
  const c=selFrames(heroIx);SEL.pf=c.pf;SEL.strip=c.strip;SEL.lastPf=-1e9;if(REDUCE&&SEL.pf)SEL.pf(1.2);
  if(dir){fc.style.setProperty('--sd',dir>0?1:-1);fc.classList.remove('swap');void fc.offsetWidth;fc.classList.add('swap');const sel=heroIx;clearTimeout(SEL.gt);SEL.gt=setTimeout(()=>{if(heroIx===sel&&SEL.strip&&SEL.strip.greet)SEL.strip.greet()},260)}}
// frame functions are built once per hero for the current canvases and reused when switching back
function selFrames(i){const pf=$('selPf'),stc=$('selStrip');let c=SEL.cache.get(i);
  if(!c||c.cv!==pf){const src=SEL.src[i],S=stripSprites(i);c={cv:pf,pf:src?SQ.makePortrait(SQH[i],src,pf):null,strip:S?SQ.makeStrip(SQH[i],stc,S):null};SEL.cache.set(i,c)}return c}
function warmSel(){let k=0;for(let i=0;i<HEROES.length;i++){if(i===heroIx)continue;setTimeout(()=>{if(scrKind==='title'&&$('selPf'))selFrames(i)},150+120*k++)}}
function stripTried(){const t=$('selTap');if(t)t.hidden=true;SEL.tried=true}
function drawSel(ts){const t=ts/1000;try{if(SEL.pf&&!REDUCE&&ts-SEL.lastPf>=32){SEL.pf(t);SEL.lastPf=ts}if(SEL.strip)SEL.strip.frame(t)}catch(e){console.error(e)}}
function hideScreen(){$('scr').hidden=true;$('scr').innerHTML='';$('scr').classList.remove('selscr');SEL.pf=SEL.strip=null;scrKind='';STAGE.inert=false;DOCK.inert=false}
function mainAction(){if(!BG)return;wakeAudio();
  if(TOUCH&&!fsEl())goFullscreen();
  if(state==='pause'){state='play';hideScreen();last=performance.now();return}
  reset();hideScreen();startIntro();last=performance.now();}
function pause(){if(state==='intro'){state='play';introT=0;INTRO.el.hidden=true}if(state!=='play')return;state='pause';showScreen('pause')}
function over(win){if(state!=='play')return;state='over';domeT=0;SUPER=null;FLY=[];ZAPS=[];DISKS=[];STRIKES=[];CHISELS=[];TREES=[];ROSES=[];P.atkT=0;beam=null;SHOTS.length=RINGS.length=0;for(const e of EN){e.mark=0;e.stun=0}if(win)score+=Math.round(uptime)*30;
  if(score>best){best=score;try{localStorage.setItem('vtoroy-faktor-best',String(best))}catch(e){}}
  queue=[];renderPush();$('banner').hidden=true;hud();showScreen('over',win)}

/* ---------- input ---------- */
const GAMEKEYS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'];
addEventListener('keydown',e=>{if(window.__vfRun!==RUN)return;const c=e.code;
  if(state==='play'&&GAMEKEYS.includes(c))e.preventDefault();
  if(c==='ArrowLeft'||c==='KeyA')keys.left=true;
  if(c==='ArrowRight'||c==='KeyD')keys.right=true;
  if(c==='ArrowDown'||c==='KeyS')keys.down=true;
  if(c==='KeyM'&&!e.repeat)toggleMute();
  if(scrKind==='over'&&c==='Space'&&(e.repeat||document.activeElement===$('btnMain'))){e.preventDefault();return}
  if(e.repeat)return;
  if(state==='intro'){if(c==='Escape'||c==='KeyP'){e.preventDefault();pause()}else if(['Space','Enter','NumpadEnter','KeyJ','KeyF','KeyX'].includes(c)){e.preventDefault();endIntro()}return}
  if(scrKind==='title'){
    if(c==='ArrowLeft'||c==='ArrowRight'||c==='KeyA'||c==='KeyD'){e.preventDefault();const d=(c==='ArrowLeft'||c==='KeyA')?-1:1;pickHero(heroIx+d,d);return}
    const dg=/^(Digit|Numpad)([1-6])$/.exec(c);if(dg){e.preventDefault();const n=+dg[2]-1;pickHero(n,n>heroIx?1:-1);return}
    if(c==='Space'&&e.target&&e.target.closest&&e.target.closest('button'))return;
    if(c==='Space'||c==='KeyJ'||c==='KeyF'||c==='KeyX'){e.preventDefault();if(SEL.strip){SEL.strip.press(null);stripTried()}return}}
  if(scrKind==='help'&&(c==='Escape'||c==='Backspace'||((c==='Enter'||c==='NumpadEnter')&&!(e.target&&e.target.closest&&e.target.closest('button'))))){e.preventDefault();showScreen(state==='title'?'title':'pause');return}
  if(state==='pause'&&(c==='ArrowUp'||c==='ArrowDown'||c==='KeyW'||c==='KeyS')){const it=[...document.querySelectorAll('#scr .mi')];
    if(it.length){e.preventDefault();let i=it.indexOf(document.activeElement);i=i<0?0:(i+(c==='ArrowUp'||c==='KeyW'?-1:1)+it.length)%it.length;it[i].focus({preventScroll:true})}return}
  if(state!=='play'&&(c==='Enter'||c==='NumpadEnter')){const tb=e.target&&e.target.closest&&e.target.closest('button');if(tb&&tb.classList.contains('hc')){e.preventDefault();setHero(+tb.dataset.i);mainAction();return}if(tb&&tb.id!=='btnMain')return}
  if(state!=='play'){if((c==='Enter'||c==='NumpadEnter')||(state==='pause'&&(c==='KeyP'||c==='Escape'))){e.preventDefault();mainAction()}return}
  if(c==='ArrowUp'||c==='KeyW'||c==='Space')doJump();
  if(c==='KeyJ'||c==='KeyF'||c==='KeyX')doAttack();
  if(c==='KeyQ'||c==='KeyE'||c==='KeyK')doAbility();
  if(c==='KeyY'||c==='Digit1'||c==='Numpad1')answer(true);
  if(c==='KeyN'||c==='Digit2'||c==='Numpad2')answer(false);
  if(c==='KeyP'||c==='Escape')pause();
});
addEventListener('keyup',e=>{const c=e.code;if(c==='ArrowLeft'||c==='KeyA')keys.left=false;if(c==='ArrowRight'||c==='KeyD')keys.right=false;if(c==='ArrowDown'||c==='KeyS')keys.down=false});
addEventListener('blur',()=>{keys.left=keys.right=keys.down=false;setTimeout(()=>{if(!document.hasFocus())pause()},200)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)doAttack()});
cv.addEventListener('contextrestored',()=>{SEL.bgDone=false});
// a tap anywhere skips the intro and is not also taken as a game action
document.getElementById('app').addEventListener('pointerdown',e=>{if(state==='intro'){e.stopPropagation();e.preventDefault();introSkipAt=performance.now();endIntro()}},true);
document.getElementById('app').addEventListener('click',e=>{if(performance.now()-introSkipAt<500){e.stopPropagation();e.preventDefault()}},true);
document.querySelectorAll('#bYes,#bNo,.ib').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
$('bYes').addEventListener('click',()=>answer(true));
$('bNo').addEventListener('click',()=>answer(false));
function toggleMute(){muted=!muted;const b=$('btnMute');b.classList.toggle('muted',muted);b.setAttribute('aria-label',muted?'Включить звук':'Выключить звук')}
$('btnMute').addEventListener('click',()=>{initAudio();toggleMute()});
$('btnPause').addEventListener('click',()=>pause());
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  const down=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('pressed');initAudio();if(k==='left'||k==='right'||k==='down')keys[k]=true;if(k==='jump')doJump();if(k==='atk')doAttack();if(k==='ab')doAbility()};
  const up=()=>{b.classList.remove('pressed');if(k==='left'||k==='right'||k==='down')keys[k]=false};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault())});
$('stage').addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- layout & fullscreen ---------- */
const TOUCH=(matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&matchMedia('(hover:none)').matches));
const APP=$('app'),STAGE=$('stage'),DOCK=$('dock');
APP.classList.toggle('touch',TOUCH);setHero(heroIx);$('hKey').textContent=TOUCH?'★':'Q';
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null}
function canFs(){const d=document.documentElement;return !!(d.requestFullscreen||d.webkitRequestFullscreen)}
function goFullscreen(){const d=document.documentElement;try{const f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f)return;const p=f.call(d);
  const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
  if(p&&p.then)p.then(lock).catch(()=>{});else lock()}catch(e){}}
function toggleFs(){if(fsEl()){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}else goFullscreen()}
if(!canFs())$('btnFs').hidden=true;
$('btnFs').addEventListener('click',toggleFs);
function layout(){
  const cs=getComputedStyle(APP);
  const aw=APP.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=APP.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const portrait=ah>aw*1.05;APP.classList.toggle('portrait',portrait);
  let w=portrait?aw:Math.min(aw,ah*16/9);w=Math.max(160,Math.floor(w));const h=Math.floor(w*9/16);
  STAGE.style.width=w+'px';STAGE.style.height=h+'px';$('btnFs').setAttribute('aria-label',fsEl()?'Выйти из полноэкранного режима':'Во весь экран');
  const tgt=portrait?DOCK:STAGE;['push','toasts','pad'].forEach(id=>{const el=$(id);if(el.parentNode!==tgt){tgt.appendChild(el);if(id==='pad'){keys.left=keys.right=keys.down=false;el.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'))}}});
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));
document.addEventListener('fullscreenchange',layout);document.addEventListener('webkitfullscreenchange',layout);
layout();

/* ---------- boot ---------- */
let last=0,errShown=false;
const RUN={};window.__vfRun=RUN;
function loop(ts){if(window.__vfRun!==RUN)return;
  const dt=Math.min(.033,Math.max(0,(ts-last)/1000));last=ts;
  try{
    if(state==='play'){if(hitstop>0)hitstop-=dt;else update(dt);hud()}
    else if(state==='intro'){introT+=dt;P.walkT+=dt;introSfx();if(introT>=INTRO_T)endIntro()}
    else if(P){P.walkT+=dt;if(scrKind==='title')drawSel(ts)}
    if(!scrKind||!SEL.bgDone){draw();if(scrKind)SEL.bgDone=true}
  }catch(err){
    console.error(err);
    if(!errShown){errShown=true;try{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#e84a5f';ctx.font='12px monospace';ctx.textBaseline='top';ctx.fillText('Ошибка: '+String(err&&err.message||err).slice(0,60),8,8)}catch(e){}}
  }
  requestAnimationFrame(loop)}
function legend(){
  const pc=$('pPhone').getContext('2d');pc.imageSmoothingEnabled=false;pc.drawImage(SPR.phone,0,0)}
async function start(){
  reset();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    if(document.readyState!=='complete')await Promise.race([new Promise(r=>addEventListener('load',r,{once:true})),wait(2000)]);
    await Promise.race([Promise.all([document.fonts.load(FONT,'КОД 0123456789'),document.fonts.load('16px "Russo One"','ДА НЕТ'),document.fonts.load('16px "Golos Text"','Света')]).then(()=>document.fonts.ready),wait(1500)]);
  }catch(e){}
  buildSprites();await loadHeroArt();SEL.src=await SQ.init();SEL.src.unshift(SQ.guardPortrait());buildFX();BG=buildBG();legend();
  showScreen('title');last=performance.now();requestAnimationFrame(loop);
}
let booted=false;
function boot(){if(booted)return;booted=true;start().catch(err=>{console.error(err);try{ctx.fillStyle='#e84a5f';ctx.font='12px monospace';ctx.fillText('Ошибка запуска: '+String(err&&err.message||err).slice(0,60),8,20)}catch(e){}})}
try{if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot)}catch(e){}
setTimeout(boot,300);
})();

</script>
